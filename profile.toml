# ProfileIT 프로필 설정 — 온라인 명함
#
# 이 파일 하나만 고치면 사이트 전체가 바뀝니다.
# 편집 후 `cargo run -- check` 로 검증하세요.
#
# sections 배열의 순서가 화면 순서입니다. 섹션을 빼고 싶으면 지우지 말고
# enabled = false 를 주면 내용은 보존됩니다.
#
# 여기 담긴 사람은 실존하지 않습니다. 기능을 한눈에 보여주려고 지어낸
# 예시입니다 — 본인 내용으로 바꿔서 쓰세요.

schema_version = 1

# ── 사이트 메타데이터 (SEO / 공유 카드) ──────────────────────────
[site]
title = { ko = "김도윤 — 온라인 명함", en = "Doyun Kim — Digital Card" }
description = { ko = "웹 개발자. 작은 도구를 만들고 산에 오릅니다.", en = "Web developer who builds small tools and climbs mountains." }
base_url = "https://example.github.io/profileit"

# 기본 언어. 이 언어가 사이트 최상단(/)에 놓입니다.
lang = "ko"
# 생성할 언어들. 나머지는 /en/ 처럼 하위 경로에 놓입니다.
languages = ["ko", "en"]
# og_image = "assets/og.png"
# favicon = "assets/favicon.png"

# ── 명함 상단 ─────────────────────────────────────────────────
# 번역이 필요한 값은 { ko = "...", en = "..." } 로 적습니다.
# 언어에 상관없이 같은 값이면 그냥 문자열로 두면 됩니다.
[profile]
name = { ko = "김도윤", en = "Doyun Kim" }
tagline = { ko = "웹 개발자", en = "Web Developer" }
location = { ko = "부산", en = "Busan" }
bio = { ko = """
웹 서비스와 작은 도구를 만듭니다.
주말에는 대체로 산에 있습니다.
""", en = """
I build web services and small tools.
On weekends I am usually up a mountain.
""" }
avatar = "assets/avatar-sample.svg"

# ── 소셜 아이콘 행 ─────────────────────────────────────────────
[[socials]]
platform = "github"
url = "https://github.com/example"

[[socials]]
platform = "instagram"
url = "https://instagram.com/example"

# ─────────────────────────────────────────────────────────────
# 섹션
# ─────────────────────────────────────────────────────────────

[[sections]]
type = "about"
title = { ko = "소개", en = "About" }
icon = "👋"
body = { ko = """
5년째 웹을 만들고 있습니다. 복잡한 화면을 단순하게 깎아내는 일을 제일 좋아합니다.
요즘은 정적 사이트 생성기를 들여다보면서 오픈소스 쪽에 발을 담그고 있습니다.
""", en = """
Five years of web work. What I enjoy most is carving complicated screens down to simple ones.
Lately I have been poking at static site generators and getting into open source.
""" }
enabled = true

[[sections]]
type = "timeline"
title = { ko = "학력", en = "Education" }
icon = "🎓"
enabled = true

[[sections.items]]
period = "2015 – 2019"
title = { ko = "○○대학교 컴퓨터공학과", en = "○○ University, Computer Science" }
subtitle = { ko = "학사", en = "BSc" }
description = { ko = "휴먼컴퓨터상호작용 연구실에서 학부 연구생으로 1년.", en = "One year as an undergraduate researcher in the HCI lab." }
enabled = true

[[sections.items]]
period = "2012 – 2015"
title = { ko = "○○고등학교", en = "○○ High School" }
enabled = true

[[sections]]
type = "timeline"
title = { ko = "경력", en = "Experience" }
icon = "💼"
enabled = true

[[sections.items]]
# "현재" 처럼 언어마다 달라지는 표기가 있어 period 도 번역합니다.
period = { ko = "2021 – 현재", en = "2021 – Present" }
title = { ko = "○○소프트", en = "○○ Soft" }
subtitle = { ko = "웹 개발", en = "Web Engineer" }
description = { ko = "사내 관리 도구의 화면과 API 를 맡고 있습니다.", en = "Screens and APIs for the internal admin tools." }
url = "https://example.com/company"
enabled = true

[[sections.items]]
period = "2019 – 2021"
title = { ko = "○○랩", en = "○○ Lab" }
subtitle = { ko = "주니어 개발자", en = "Junior Developer" }
description = { ko = "예약 페이지를 전부 서버 렌더링으로 옮겼습니다.", en = "Moved the booking pages over to server rendering." }
enabled = true

[[sections]]
type = "checklist"
title = { ko = "버킷리스트", en = "Bucket List" }
icon = "✨"
show_progress = true
enabled = true

[[sections.items]]
text = { ko = "오픈소스 프로젝트 star 100개", en = "100 stars on an open source project" }
done = false

[[sections.items]]
text = { ko = "지리산 종주", en = "Traverse Jirisan" }
done = true
date = "2025-04"
note = { ko = "둘째 날 비가 내내 왔습니다.", en = "It rained the whole second day." }

[[sections.items]]
text = { ko = "하프 마라톤 완주", en = "Finish a half marathon" }
done = true
date = "2024-10"

[[sections.items]]
text = { ko = "직접 만든 도구를 패키지로 배포", en = "Publish a tool I made as a package" }
done = false

[[sections.items]]
text = { ko = "직접 만든 명함 사이트 쓰기", en = "Use a digital card site I built myself" }
done = false

[[sections]]
type = "tags"
title = { ko = "관심사", en = "Interests" }
icon = "🧩"
# 태그는 세 가지로 적을 수 있습니다.
#   "Rust"                                      — 번역도 이모지도 없음
#   { ko = "등산", en = "Hiking" }               — 번역만
#   { icon = "⛰️", text = { ko = ..., en = ... } } — 이모지까지
items = [
  { icon = "🦀", text = "Rust" },
  { icon = "🟦", text = "TypeScript" },
  { icon = "🎨", text = { ko = "인터페이스 디자인", en = "Interface Design" } },
  { icon = "⛰️", text = { ko = "등산", en = "Hiking" } },
  { icon = "☕", text = { ko = "커피", en = "Coffee" } },
  { icon = "📷", text = { ko = "사진", en = "Photography" } },
  { icon = "✈️", text = { ko = "여행", en = "Travel" } },
]
enabled = true

[[sections]]
type = "links"
title = { ko = "블로그 & 채널", en = "Blog & Channels" }
icon = "🔗"
enabled = true

[[sections.items]]
title = { ko = "기술 블로그", en = "Engineering Blog" }
url = "https://example.com/blog"
subtitle = { ko = "웹 이야기 위주", en = "Mostly web things" }
enabled = true
highlight = false

[[sections.items]]
title = { ko = "산행 기록", en = "Trail Notes" }
url = "https://example.com/trails"
badge = "NEW"
highlight = true
enabled = true

[[sections.items]]
title = { ko = "사진첩", en = "Photo Log" }
url = "https://example.com/photos"
enabled = true
highlight = false

[[sections]]
type = "contact"
title = { ko = "연락처", en = "Contact" }
icon = "📮"
enabled = true

[[sections.items]]
kind = "email"
value = "hello@example.com"

[[sections.items]]
kind = "website"
value = "https://example.github.io/profileit"

# ── 테마 (여기 값들이 CSS 변수로 그대로 내려갑니다) ──────────────
[theme]
accent = "#2f9fd0"

[theme.background]
type = "gradient"
from = "#dff2fb"
to = "#bfe6f7"
angle = 165

[theme.decoration]
type = "preset"
name = "confetti"

# 명함 본체(흰 종이)
[theme.sheet]
background = "#ffffff"
radius = "24px"
shadow = true

# 섹션 안에 들어가는 링크 카드
[theme.card]
background = "#f5fafd"
radius = "14px"
shadow = false
style = "fill"

[theme.text]
heading = "#14425c"
body = "#3c5a6b"
card_title = "#1a6f96"
muted = "#7b96a5"

# 프리셋을 고르면 폰트 스택과 웹폰트 주소가 함께 따라옵니다.
# 고를 수 있는 값: system pretendard noto_sans_kr nanum_gothic nanum_myeongjo
#                gaegu jua ibm_plex_sans_kr gowun_dodum custom
[theme.font]
preset = "pretendard"
# heading_preset = "jua"      # 제목만 다른 폰트로
heading_weight = 800
base_size = "15px"
line_height = 1.6
letter_spacing = "normal"
stylesheets = []

# preset = "custom" 일 때만:
# family = "'My Font', sans-serif"
# stylesheets = ["https://example.com/my-font.css"]

# ── 기능 토글 ─────────────────────────────────────────────────
[features]
# 링크 카드 오른쪽 ⋮ 버튼: 링크 복사 / 공유
share_menu = true
# 상단 "연락처 저장" 버튼 — contact 섹션 내용으로 .vcf 파일을 만듭니다
vcard_download = true

# ── GitHub Pages 배포 ─────────────────────────────────────────
# 토큰을 받지 않습니다. 이미 설정된 git 자격증명을 그대로 씁니다.
# 리포지터리 생성과 Pages 활성화는 GitHub 웹에서 한 번 해주세요.
[deploy]
remote = "origin"
branch = "gh-pages"
# 사용자 지정 도메인을 쓴다면 (dist/CNAME 이 만들어집니다)
# cname = "card.example.com"

# ── 푸터 ─────────────────────────────────────────────────────
[footer]
# text = "© 2026 김도윤"
show_powered_by = true
