[package]
name = "profileit-desktop"
version = "0.1.0"
edition = "2021"
description = "ProfileIT 데스크톱 편집기"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# 편집 서버와 검증·렌더링은 전부 여기서 옵니다. 앱은 창만 담당합니다.
profileit = { path = "..", features = ["editor"] }

